name: Integrate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: holepunchto/actions/node-base@aec0d5d8fb4e5b9c2480f79cd687db941428a279 # v1
        with:
          allow-git: all
      - run: npm run lint
